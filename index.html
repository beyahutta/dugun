<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armağan &amp; Gözde · Düğün Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EFE8D6;
    --ink:#3E2F20;
    --gold:#6E5334;
    --wax:#7E2A28;
    --bg:#2E2418;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at 50% 30%, #3D3021 0%, var(--bg) 65%, #221A10 100%);
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 14px 10vh;
    overflow-x:hidden;
  }

  /* ---------- ALTIN ZERRECİKLER ---------- */
  #dust{
    position:fixed; inset:0;
    z-index:0;
    pointer-events:none;
  }

  #stage{width:min(520px, 94vw); position:relative; z-index:1;}

  /* ---------- MÜZİK BUTONU ---------- */
  #muteBtn{
    position:fixed; top:14px; right:14px; z-index:20;
    width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(163,130,62,.6);
    background:rgba(46,36,24,.75);
    color:#D9C9A3;
    cursor:pointer;
    display:none;
    align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
    transition:transform .2s ease, background .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #muteBtn:hover{transform:scale(1.08); background:rgba(66,52,34,.85);}
  #muteBtn svg{width:22px;height:22px;fill:#D9C9A3;}
  body.open #muteBtn{display:flex;}

  /* ---------- RULO ---------- */
  .roll{
    height:42px;
    border-radius:21px;
    background:linear-gradient(180deg,
      #cbbf9f 0%, #f5eeda 22%, #efe6cd 45%,
      #c9bb97 72%, #8f815f 92%, #6e6247 100%);
    box-shadow:0 10px 22px rgba(0,0,0,.45), inset 0 -4px 8px rgba(90,75,45,.35);
    position:relative;
    z-index:3;
  }
  .roll::before,.roll::after{
    content:"";
    position:absolute; top:3px; bottom:3px; width:19px;
    background:radial-gradient(ellipse at center, #d8ccab 0%, #a99a72 55%, #7a6c4b 100%);
    border-radius:50%;
    box-shadow:inset 0 0 6px rgba(60,48,25,.6);
  }
  .roll::before{left:-6px;}
  .roll::after{right:-6px;}
  .roll-bottom{margin-top:-2px;}

  /* ---------- KAĞIT ---------- */
  #paperClip{
    overflow:hidden;
    max-height:0;
    transition:max-height 3.4s cubic-bezier(.25,.1,.25,1);
  }
  body.open #paperClip{max-height:2600px;}

  #paper{
    background:#BEA892;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  #paper img{display:block;width:100%;height:auto;}

  /* ---------- TARİH & YER ---------- */
  .when{
    text-align:center;
    padding:8px 26px 40px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 55%),
      linear-gradient(180deg, #BEA892 0%, #B09A82 100%);
  }
  .when .label{
    letter-spacing:.42em;
    font-size:.78rem;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .divider{width:170px;margin:0 auto 22px;display:block;opacity:.85;}
  .date-line{
    display:flex; align-items:center; justify-content:center; gap:16px;
    color:var(--ink);
  }
  .date-line .day{
    font-weight:600;
    font-size:clamp(2.6rem, 10vw, 3.3rem);
    line-height:1;
  }
  .date-line .col{
    text-align:left;
    font-size:clamp(1rem, 3.4vw, 1.2rem);
    line-height:1.45;
    letter-spacing:.06em;
  }
  .date-line .col em{font-style:italic;color:#5E4A34;}
  .time{
    margin-top:12px;
    font-size:clamp(1.15rem, 4vw, 1.35rem);
    font-weight:600;
    letter-spacing:.14em;
    color:var(--ink);
  }
  .place{
    margin-top:8px;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:400;
    font-size:clamp(1rem, 3.4vw, 1.15rem);
    letter-spacing:.04em;
    color:#5E4A34;
  }
  .address{
    margin-top:16px;
    font-size:clamp(1.1rem, 3.8vw, 1.3rem);
    font-weight:500;
    line-height:1.5;
    color:var(--ink);
    letter-spacing:.05em;
  }
  .mapBtn{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:16px;
    padding:11px 22px;
    border:1px solid var(--gold);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(94,71,48,.16), rgba(94,71,48,.06));
    color:#3E2F20;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:.06em;
    text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .mapBtn:hover{
    transform:translateY(-1px);
    background:linear-gradient(180deg, rgba(94,71,48,.26), rgba(94,71,48,.12));
    box-shadow:0 4px 14px rgba(90,70,40,.25);
  }
  .mapBtn svg{width:17px;height:17px;fill:#5E4730;}
  .place small{
    font-size:.9em;
    font-style:italic;
    color:#5E4A34;
  }

  /* ---------- GERİ SAYIM ---------- */
  .countdown{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid rgba(94,71,48,.4);
  }
  .countdown .cd-label{
    letter-spacing:.34em;
    font-size:.72rem;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .cd-grid{
    display:flex; justify-content:center; gap:clamp(12px,4vw,26px);
  }
  .cd-cell .num{
    font-weight:600;
    font-size:clamp(1.7rem, 6.5vw, 2.3rem);
    line-height:1;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .cd-cell .unit{
    margin-top:5px;
    font-size:.8rem;
    font-style:italic;
    color:#5E4A34;
    letter-spacing:.08em;
  }

  /* ---------- MÜHÜR ---------- */
  #sealWrap{
    position:absolute;
    left:50%; top:21px;
    transform:translateX(-50%);
    z-index:6;
    text-align:center;
    transition:opacity .9s ease, transform .9s ease;
  }
  body.open #sealWrap{
    opacity:0;
    transform:translateX(-50%) scale(1.25) rotate(-8deg);
    pointer-events:none;
  }
  #seal{
    width:116px;height:116px;
    border:none;background:none;cursor:pointer;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));
    transition:transform .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #seal:hover, #seal:focus-visible{transform:scale(1.06);}
  #seal:focus-visible{outline:2px solid var(--gold); outline-offset:6px; border-radius:50%;}
  @keyframes pulse{
    0%,100%{filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));}
    50%{filter:drop-shadow(0 8px 26px rgba(200,60,50,.55));}
  }
  body:not(.open) #seal{animation:pulse 2.6s ease-in-out infinite;}
  #hint{
    margin-top:10px;
    font-style:italic;
    color:#D9C9A3;
    font-size:1.05rem;
    letter-spacing:.08em;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }

  @media (prefers-reduced-motion: reduce){
    #paperClip{transition:none;}
    #sealWrap{transition:none;}
    body:not(.open) #seal{animation:none;}
    #dust{display:none;}
  }
</style>
</head>

/* ================= GERİ SAYIM ================= */
(function(){
  var target = new Date(2026, 8, 13, 0, 0, 0); // 13 Eylül 2026
  var D=document.getElementById('cdD'), H=document.getElementById('cdH'), M=document.getElementById('cdM');
  function tick(){
    var diff = target - new Date();
    if(diff <= 0){
      document.getElementById('cd').innerHTML =
        '<div class="cd-cell"><div class="num">Bugün! 🎉</div></div>';
      return;
    }
    D.textContent = Math.floor(diff/86400000);
    H.textContent = Math.floor(diff/3600000)%24;
    M.textContent = Math.floor(diff/60000)%60;
    setTimeout(tick, 30000);
  }
  tick();
})();

/* ================= ALTIN ZERRECİKLER ================= */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('dust'), cx = cv.getContext('2d'), P = [];
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  for (var i=0;i<70;i++){
    P.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*2.6+.8,
      vy:-(Math.random()*.3+.08), vx:(Math.random()-.5)*.18,
      a:Math.random()*.6+.35, ph:Math.random()*6.28,
      big:Math.random()<.25
    });
  }
  (function draw(t){
    cx.clearRect(0,0,cv.width,cv.height);
    for (var i=0;i<P.length;i++){
      var p = P[i];
      p.y += p.vy; p.x += p.vx + Math.sin(t/1800 + p.ph)*.12;
      if (p.y < -8){ p.y = cv.height+8; p.x = Math.random()*cv.width; }
      if (p.x < -8) p.x = cv.width+8; else if (p.x > cv.width+8) p.x = -8;
      var tw = .55 + .45*Math.sin(t/700 + p.ph);
      var al = p.a*tw;
      if (p.big){
        // buyuk taneler: isilti halesi + yildiz parlamasi
        var g = cx.createRadialGradient(p.x,p.y,0, p.x,p.y,p.r*5);
        g.addColorStop(0,'rgba(240,214,150,'+(al*.9).toFixed(3)+')');
        g.addColorStop(.4,'rgba(212,178,106,'+(al*.35).toFixed(3)+')');
        g.addColorStop(1,'rgba(212,178,106,0)');
        cx.beginPath();
        cx.arc(p.x, p.y, p.r*5, 0, 6.28);
        cx.fillStyle = g;
        cx.fill();
        // capraz isik cizgileri
        cx.strokeStyle = 'rgba(240,214,150,'+(al*.6).toFixed(3)+')';
        cx.lineWidth = 1;
        cx.beginPath();
        cx.moveTo(p.x-p.r*4, p.y); cx.lineTo(p.x+p.r*4, p.y);
        cx.moveTo(p.x, p.y-p.r*4); cx.lineTo(p.x, p.y+p.r*4);
        cx.stroke();
      }
      cx.beginPath();
      cx.arc(p.x, p.y, p.r, 0, 6.28);
      cx.fillStyle = 'rgba(228,196,126,' + al.toFixed(3) + ')';
      cx.fill();
    }
    requestAnimationFrame(draw);
  })(0);
})();

  var ac = null, master = null, delayGain = null, muted = false, timer = null;
  var NOTE = {D3:146.83, E3:164.81, Fs3:185.00, G3:196.00, A3:220.00, B3:246.94,
              Cs4:277.18, D4:293.66, E4:329.63, Fs4:369.99, G4:392.00, A4:440.00,
              B4:493.88, Cs5:554.37, D5:587.33, E5:659.25, Fs5:739.99, G5:783.99, A5:880.00};
  // Kanon akor yürüyüşü: D  A  Bm  F#m  G  D  G  A  — her akor arpej
  var chords = [
    ['D3','A3','D4','Fs4','A4','D5'],
    ['A3','Cs4','E4','A4','Cs5','E5'],
    ['B3','D4','Fs4','B4','D5','Fs5'],
    ['Fs3','A3','Cs4','Fs4','A4','Cs5'],
    ['G3','B3','D4','G4','B4','D5'],
    ['D3','A3','D4','Fs4','A4','D5'],
    ['G3','B3','D4','G4','B4','D5'],
    ['A3','Cs4','E4','A4','Cs5','E5']
  ];
  var STEP = 0.42;          // arpej notaları arası saniye
  var ci = 0, ni = 0, nextT = 0;

  function pluck(freq, when, vel){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vel, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 2.2);
    o.connect(g); g.connect(master); g.connect(delayGain);
    o.start(when); o.stop(when + 2.4);
  }
  function schedule(){
    while (nextT < ac.currentTime + 0.6){
      var ch = chords[ci];
      var name = ch[ni];
      pluck(NOTE[name], nextT, ni === 0 ? 0.10 : 0.065);
      // üst oktavda hafif parıltı
      if (ni === 3) pluck(NOTE[name]*2, nextT + 0.02, 0.02);
      ni++;
      if (ni >= ch.length){ ni = 0; ci = (ci+1) % chords.length; }
      nextT += STEP;
    }
    timer = setTimeout(schedule, 180);
  }
  function start(){
    if (ac) return;
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ return; }
    master = ac.createGain(); master.gain.value = 0.34;
    // yumuşak yankı
    var delay = ac.createDelay(); delay.delayTime.value = 0.34;
    var fb = ac.createGain(); fb.gain.value = 0.32;
    var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2400;
    delayGain = ac.createGain(); delayGain.gain.value = 0.5;
    delayGain.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(lp); lp.connect(master);
    master.connect(ac.destination);
    nextT = ac.currentTime + 0.25;
    schedule();
  }
  function toggle(){
    if (!ac) return true;
    muted = !muted;
    master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.34, ac.currentTime + 0.3);
    return muted;
  }
  return {start:start, toggle:toggle};
})();

/* ================= AÇILIŞ ================= */
document.getElementById('seal').addEventListener('click', function(){
  document.body.classList.add('open');
  Music.start();
});

var mb = document.getElementById('muteBtn');
mb.addEventListener('click', function(){
  var m = Music.toggle();
  document.getElementById('icoOn').style.display  = m ? 'none' : 'block';
  document.getElementById('icoOff').style.display = m ? 'block' : 'none';
  mb.setAttribute('aria-label', m ? 'Müziği aç' : 'Müziği kapat');
});
</script>
